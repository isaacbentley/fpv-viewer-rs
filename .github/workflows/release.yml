name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege token. The build legs only read the repository; the
# one job that publishes asks for what it needs itself.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the tag it corresponds
# to in the trailing comment; Dependabot updates both together.
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Ship whatever platforms succeed: one target's toolchain hiccup
      # shouldn't cancel the other release artifacts.
      fail-fast: false
      # No Windows target: the SoapySDR backend links libSoapySDR via
      # pkg-config, and there is no workable unattended SoapySDR install
      # on the Windows runners today. Windows users build from source
      # (see README).
      matrix:
        include:
          # Pinned, not ubuntu-latest: the arm64 packages below come from
          # the `noble` suites on ports.ubuntu.com, and apt refuses to mix
          # them with a newer runner's own packages ("Packages were
          # downgraded"). The pin also fixes the binary's glibc at
          # noble's 2.39.
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact_name: fpv-viewer-linux-rpi5
            ext: ""
          # Native Apple Silicon. An x86_64 cross-target can't link
          # against Homebrew's arm64 libSoapySDR on the arm64 runners.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fpv-viewer-macos-arm64
            ext: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cross-Compilation Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture arm64
          # The default archive/security.ubuntu.com mirrors host amd64
          # only; fetching arm64 indexes from them 404s and fails
          # `apt-get update`. Restrict the stock sources to amd64 and
          # add ports.ubuntu.com (the arm64 mirror) for arm64 packages.
          sudo sed -i 's/^Signed-By:/Architectures: amd64\nSigned-By:/' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null <<'SRC'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config
          # Install the arm64 versions of our SDR and UI dependencies.
          sudo apt-get install -y libsoapysdr-dev:arm64 libasound2-dev:arm64 libiio-dev:arm64 libfontconfig1-dev:arm64
          
          # Tell cargo which linker to use for aarch64
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          
          # Point pkg-config to the arm64 sysroot
          {
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_DIR="
            echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            echo "PKG_CONFIG_SYSROOT_DIR=/"
          } >> "$GITHUB_ENV"

      - name: Install SoapySDR (macOS)
        if: runner.os == 'macOS'
        run: brew install soapysdr

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build Release Binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      # For Windows and Linux, just upload the binary
      - name: Upload Binary (Windows/Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/fpv-viewer${{ matrix.ext }}

      # For macOS, package as DMG to follow global preference
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p FPVViewer
          cp target/${{ matrix.target }}/release/fpv-viewer FPVViewer/
          hdiutil create -volname "FPVViewer" -srcfolder FPVViewer -ov -format UDZO "${{ matrix.artifact_name }}.dmg"

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}-dmg
          path: ${{ matrix.artifact_name }}.dmg

  publish-release:
    name: Publish GitHub Release
    needs: build
    # Runs when a build leg failed too, so the platforms that did build
    # still ship; `Prepare Release Assets` fails if none did.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Sign and store the build-provenance attestation.
      id-token: write
      attestations: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          if [ -f release-assets/fpv-viewer-linux-rpi5/fpv-viewer ]; then
            cp release-assets/fpv-viewer-linux-rpi5/fpv-viewer dist/fpv-viewer-linux-rpi5
            chmod +x dist/fpv-viewer-linux-rpi5
          fi
          find release-assets -name "*.dmg" -exec cp {} dist/ \;
          ls -la dist/
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no build produced a release asset"
            exit 1
          fi

      # One line per asset, in the form `sha256sum -c SHA256SUMS` reads.
      # Written after the emptiness check above, and before anything is
      # attested or published, so all three cover the same bytes.
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      # Signed provenance for every asset listed in SHA256SUMS: which
      # workflow run, at which commit, built these digests. Verify with
      # `gh attestation verify <asset> --repo <owner>/fpv-viewer-rs`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false

