name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Least-privilege token: no job in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA, with the tag it corresponds
# to in the trailing comment; Dependabot updates both together.
jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows job: the SoapySDR backend links libSoapySDR via
      # pkg-config and the Windows runners have no unattended SoapySDR
      # install. Windows users build from source with SoapySDR installed,
      # or with `--no-default-features --features aaronia` (see README).
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev cmake pkg-config libasound2-dev libiio-dev libfontconfig1-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install soapysdr

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Default features: `soapy` and `aaronia`. The AARTSAAPI SDK is
      # resolved at runtime, not link time, so the Aaronia backend builds
      # and tests here without one installed.
      - name: cargo test
        run: cargo test --locked

  clippy_fmt:
    name: Clippy + Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev cmake pkg-config libasound2-dev libiio-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # Default features — see the note on the test job.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Each backend alone, and neither: the cfg gates must hold up
      # without the other feature switched on.
      - name: cargo clippy (per backend)
        run: |
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features soapy -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features aaronia -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Advisories (RUSTSEC), licences, bans and sources, per deny.toml.
      # It reads Cargo.lock and the manifests only, so it needs none of
      # the system libraries the build does.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
