name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No Windows job: the SoapySDR backend links libSoapySDR via
      # pkg-config and the Windows runners have no unattended SoapySDR
      # install. Windows users build from source with SoapySDR installed,
      # or with `--no-default-features --features aaronia` (see README).
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev cmake pkg-config libasound2-dev libiio-dev libfontconfig1-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install soapysdr

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Default features: `soapy` and `aaronia`. The AARTSAAPI SDK is
      # resolved at runtime, not link time, so the Aaronia backend builds
      # and tests here without one installed.
      - name: cargo test
        run: cargo test --locked

  clippy_fmt:
    name: Clippy + Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev cmake pkg-config libasound2-dev libiio-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # Default features — see the note on the test job.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Each backend alone, and neither: the cfg gates must hold up
      # without the other feature switched on.
      - name: cargo clippy (per backend)
        run: |
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features soapy -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features aaronia -- -D warnings
