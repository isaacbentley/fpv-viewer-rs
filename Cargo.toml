[package]
name = "fpv-viewer"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "A real-time cross-SDR viewer for analog FPV drone video signals"
license = "GPL-3.0-or-later"

[dependencies]
orecchiette-fpv-drone-analog-rs = { git = "https://github.com/isaacbentley/orecchiette-fpv-drone-analog-rs.git", branch = "main" }
orecchiette-sdr-source-rs = "0.1.0"
orecchiette-sdr-usrp-rs = { git = "https://github.com/isaacbentley/orecchiette-sdr-usrp-rs.git", branch = "main" }
orecchiette-sdr-hackrf-rs = { git = "https://github.com/isaacbentley/orecchiette-sdr-hackrf-rs.git", branch = "main" }
# Optional: links against the native AARTSAAPI SDK, which most build
# hosts (and CI) don't have — enable with `--features aaronia`. For
# local co-development against a sibling checkout, add:
#   [patch."https://github.com/isaacbentley/sdr-aaronia-rs.git"]
#   sdr-aaronia-rs = { path = "../sdr-aaronia-rs" }
sdr-aaronia-rs = { git = "https://github.com/isaacbentley/sdr-aaronia-rs.git", tag = "v0.6.2", features = [
    "native-sdk",
], optional = true }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
num-complex = "0.4"
minifb = "0.28"
bytemuck = "1.0"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"

[features]
default = []
# Aaronia Spectran V6 backend (`aaronia` subcommand). Off by default so
# a fresh clone / CI runner builds without the Aaronia native SDK.
aaronia = ["dep:sdr-aaronia-rs"]
# Neural temporal denoiser (`--denoise`, toggled live with `D`). Off by
# default: it pulls in ONNX Runtime, and the denoiser is a win under
# impairment but a small cost on a clean signal — see the analog crate's
# DESIGN.md §12 for the measured A/B.
neural-vsr = ["orecchiette-fpv-drone-analog-rs/neural-vsr"]
