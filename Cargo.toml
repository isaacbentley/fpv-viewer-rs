[package]
name = "fpv-viewer"
version = "0.13.0"
edition = "2024"
rust-version = "1.89"
description = "A real-time cross-SDR viewer for analog FPV drone video signals"
license = "GPL-3.0-or-later"

[dependencies]
orecchiette-fpv-drone-analog-rs = { git = "https://github.com/isaacbentley/orecchiette-fpv-drone-analog-rs.git", rev = "a80d55f1e5cedeafc3f42f450e055c5d2a4ba3c8" }
# SoapySDR: links the system libSoapySDR (found via pkg-config); the
# device itself is reached through whichever SoapySDR module drives it
# (SoapyHackRF, SoapyUHD, ...), installed separately.
soapysdr = { version = "0.5.1", optional = true }
# Default features off: the crate's `sdr-source` facade pulls in a
# source trait this viewer does not use — it drives the unified source
# itself (`src/sdr/aaronia.rs`). `http` + `file` are what the unified
# source needs; `native-sdk` adds `aaronia sdk`. For local
# co-development against a sibling checkout, add:
#   [patch."https://github.com/isaacbentley/sdr-aaronia-rs.git"]
#   sdr-aaronia-rs = { path = "../sdr-aaronia-rs" }
sdr-aaronia-rs = { git = "https://github.com/isaacbentley/sdr-aaronia-rs.git", tag = "v0.11.1", default-features = false, features = [
    "http",
    "file",
    "native-sdk",
], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
num-complex = "0.4"
minifb = "0.28"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"

[features]
default = ["soapy", "aaronia"]
# SoapySDR backend (`soapy` subcommand): HackRF, USRP, LimeSDR and any
# other device with a SoapySDR module. Needs libSoapySDR to build.
soapy = ["dep:soapysdr"]
# Aaronia Spectran V6 backend (`aaronia` subcommand). On by default: the
# AARTSAAPI SDK is resolved at *runtime*, not link time (the binary
# carries no dynamic reference to it), so building needs no SDK — and
# the HTTP backend never needs it at all, only `aaronia sdk` does.
# `--no-default-features` builds with neither backend: file replay only.
aaronia = ["dep:sdr-aaronia-rs", "dep:tokio"]
# Neural temporal denoiser (`--denoise`, toggled live with `D`). Off by
# default: it pulls in ONNX Runtime, and the denoiser is a win under
# impairment but a small cost on a clean signal — see the analog crate's
# DESIGN.md §12 for the measured A/B.
neural-vsr = ["orecchiette-fpv-drone-analog-rs/neural-vsr"]
